<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Harness · 科研工作台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/markdown.css"></head><body><header><b><span class="logo">♧</span> Research Harness</b><span class="header-right">本地科研工作台 <i id="health">连接中</i></span></header><aside><div class="muted small">研究项目</div><button id="new" class="new">＋ 新建研究项目</button><div id="projects"></div><div class="divider"></div><nav id="nav"></nav><div class="aside-bottom">DeepSeek Harness<br><span class="muted small">证据驱动 · 本地保存</span></div></aside><main id="main"></main><div id="toast" role="status"></div><dialog id="create"><form id="create-form"><h2>开始一个新的研究</h2><p class="muted">填写项目名称，绑定一个已存在的本机文件夹作为工作区。Harness 将在该目录中读取资料、保存文件和运行实验。</p><label for="project-name">项目名称</label><input id="project-name" required maxlength="100" placeholder="例如：水下机器人视觉研究"><label for="project-directory">项目目录（工作区绝对路径）</label><input id="project-directory" required maxlength="4096" placeholder="例如 D:\research\my-project"><p class="muted small">每个工作区只能绑定一个项目。请先创建文件夹，再粘贴完整路径。</p><p id="create-error" class="warning" role="alert" hidden></p><div class="actions"><button type="button" id="dismiss">取消</button><button class="primary">创建项目</button></div></form></dialog><script src="/vendor/marked.umd.js" defer></script><script src="/vendor/purify.min.js" defer></script><script src="/markdown.js" defer></script><script src="/app.js" defer></script><dialog id="confirm-dialog"><form id="confirm-form"><h2 id="confirm-title">确认阶段成果</h2><textarea id="confirm-content" rows="12" required></textarea><div class="actions"><button type="button" id="confirm-dismiss">取消</button><button class="primary">保存确认</button></div></form></dialog></body></html>
