<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Harness</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
  <script src="/research.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <header class="brand"><span class="brand-mark">r</span><div>Research Harness<small>本地科研工作台</small></div></header>
    <div class="section-heading"><h2>项目</h2><button id="add-project" class="icon-button" aria-label="添加项目">+</button></div>
    <nav id="projects" aria-label="项目列表"></nav>
    <div id="session-list">
      <div class="session-heading"><h2>会话</h2><button id="new-session" class="text-button" disabled>+ 新建会话</button></div>
      <nav id="sessions" aria-label="会话列表"></nav>
    </div>
    <footer class="sidebar-footer"><span class="connection-dot"></span>本机存储 · 官方 Python SDK</footer>
  </aside>
  <main>
    <header class="workspace-header"><div><h1 id="project-title">选择一个研究项目</h1><p id="project-directory">从已有的本机目录开始</p></div><span id="status" role="status">就绪</span></header>
    <nav id="research-nav" aria-label="科研流程" hidden></nav>
    <section id="research-panel" hidden></section>
    <section id="approval-panel" aria-label="工具审批" hidden></section>
    <div id="error" role="alert" hidden></div>
    <section id="conversation" aria-label="当前会话">
      <div id="empty-state"><span class="empty-mark">r</span><h2>从一个研究问题开始</h2><p>添加项目并新建会话，即可使用文件工具、运行代码和开展调研。<br>会话历史保存在本机，可以随时回来继续。</p><button id="empty-add" class="primary">添加项目</button></div>
      <div id="messages" aria-live="polite"></div>
    </section>
    <form id="chat" class="composer">
      <label class="sr-only" for="message">发送消息</label>
      <textarea id="message" rows="3" maxlength="16000" placeholder="输入研究问题或任务…" required disabled></textarea>
      <div class="composer-footer"><span id="session-hint">请选择项目并新建会话</span><button id="send" class="primary" disabled>发送消息 <span aria-hidden="true">↑</span></button></div>
    </form>
  </main>
  <dialog id="project-dialog">
    <form id="project-form">
      <h2>添加研究项目</h2><p>绑定一个已存在的本机目录，AI 将在该目录中工作。</p>
      <label for="project-name">项目名称</label><input id="project-name" maxlength="100" placeholder="例如，论文复现实验" required>
      <label for="project-path">项目目录（绝对路径）</label><input id="project-path" placeholder="D:\research\my-project 或 /home/user/research" required>
      <p id="project-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" id="cancel-project" class="secondary">取消</button><button type="submit" id="save-project" class="primary">添加项目</button></div>
    </form>
  </dialog>
  <dialog id="research-dialog">
    <form id="research-form">
      <h2 id="research-dialog-title"></h2>
      <label for="research-content" id="research-content-label"></label>
      <textarea id="research-content" rows="10" required></textarea>
      <p id="research-dialog-error" class="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="research-dismiss" class="secondary">取消</button>
        <button type="submit" class="primary">保存确认</button>
      </div>
    </form>
  </dialog>
</body>
</html>
